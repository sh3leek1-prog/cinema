<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream - سينما المباشر</title>
  
  <!-- مكتبة Supabase للتواصل المباشر مع قاعدة البيانات من المتصفح -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- ملف التنسيقات الخارجية -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط التنقل العلوي -->
  <navbar>
    <div class="logo" onclick="resetToHome()">CineStream</div>
    <div class="nav-links">
      <button class="nav-btn active" id="btnMovies" onclick="switchMainTab('movie')">الأفلام</button>
      <button class="nav-btn" id="btnTV" onclick="switchMainTab('tv')">المسلسلات</button>
      <button class="nav-btn" id="btnGenres" onclick="showGenresView()">التصنيفات</button>
    </div>
    <input type="text" class="search-box" id="searchInput" placeholder="ابحث باسم الفيلم أو المسلسل..." oninput="handleSearch()">
  </navbar>

  <!-- البانر الرئيسي المخفي منه واجهة يوتيوب -->
  <div class="hero" id="heroBanner">
    <div id="heroVideoContainer"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">جاري تحميل المحتوى...</h1>
      <p class="hero-desc" id="heroDesc"></p>
      <button class="btn-action" id="heroDetailsBtn" style="display:none;">ℹ تفاصيل أكثر</button>
    </div>
  </div>

  <!-- قسم التصنيفات والتصفية -->
  <div class="genres-section" id="genresSection">
    <div class="section-title" style="margin-bottom:15px;">اختر التصنيف المفضل</div>
    <div class="genres-grid" id="genresGrid"></div>

    <div class="filter-bar">
      <div class="filter-group">
        <label>ترتيب حسب:</label>
        <select class="filter-select" id="sortBySelect" onchange="applyFilters()">
          <option value="popularity.desc">الأكثر شعبية</option>
          <option value="vote_average.desc">الأعلى تقييماً</option>
          <option value="primary_release_date.desc">أحدث تاريخ إصدار</option>
          <option value="title.asc">الأبجدي (A-Z)</option>
        </select>
      </div>

      <div class="filter-group">
        <label>اللغة الأصلية:</label>
        <select class="filter-select" id="langSelect" onchange="applyFilters()">
          <option value="">جميع اللغات</option>
          <option value="en">الإنجليزي (English)</option>
          <option value="ar">العربي (Arabic)</option>
          <option value="fr">الفرنسي (French)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- شبكة لعرض بطاقات الأفلام والمسلسلات -->
  <div class="main-section">
    <div class="section-header">
      <div class="section-title" id="sectionTitle">أحدث الأفلام الشائعة</div>
    </div>
    <div class="grid-container" id="contentGrid"></div>
    <div class="loader" id="loader">⏳ جاري تحميل المزيد من الأعمال...</div>
  </div>

  <!-- نافذة عرض تفاصيل العمل والتريلر -->
  <div class="modal" id="detailsModal" onclick="checkOuterClick(event, 'detailsModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal" onclick="closeModal('detailsModal')">&times;</button>

      <div class="details-hero" id="modalBackdrop">
        <div class="details-hero-overlay"></div>
      </div>

      <div class="details-body">
        <div class="details-header">
          <img src="" id="modalPoster" class="details-poster" alt="">
          <div style="display:flex; flex-direction:column; justify-content:flex-end;">
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;" id="modalTitle"></h2>
            <div style="margin-bottom: 12px; color: var(--text-muted);" id="modalMeta"></div>
            <button class="btn-action" id="modalPlayBtn">▶ مشاهدة الآن</button>
          </div>
        </div>
        <p style="color: #d1d1d6; line-height: 1.6; font-size: 14px;" id="modalOverview"></p>
      </div>
    </div>
  </div>

  <!-- نافذة مشغل الفيديو الرئيسي -->
  <div class="modal" id="videoModal" onclick="checkOuterClick(event, 'videoModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal" onclick="closePlayer()">&times;</button>
      <div class="player-container" id="playerWrapper"></div>
    </div>
  </div>

  <!-- ملف البرمجة الخارجية -->
  <script src="script.js"></script>
</body>
</html>
