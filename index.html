<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStream World - المنصة السينمائية الشاملة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط التنقل العلوي الزجاجي -->
  <nav class="navbar">
    <div class="nav-brand" onclick="resetToHome()">CINE<span style="color:#fff;">STREAM</span></div>
    <div class="nav-links">
      <button class="nav-btn active" id="btnMovies" onclick="switchMainTab('movie')">الأفلام</button>
      <button class="nav-btn" id="btnTV" onclick="switchMainTab('tv')">المسلسلات</button>
      <button class="nav-btn" id="btnGenres" onclick="showGenresView()">التصنيفات</button>
      <button class="nav-btn" id="btnWatchlist" onclick="showWatchlist()">المفضلة</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم، مسلسل..." oninput="handleSearch()">
    </div>
  </nav>

  <!-- البانر التفاعلي الرئيسي -->
  <header class="hero" id="heroBanner">
    <div id="heroVideoContainer"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">جاري تحميل المحتوى...</h1>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-buttons">
        <button class="btn-main" id="heroPlayBtn">▶ مشاهدة فوري</button>
        <button class="btn-secondary" id="heroDetailsBtn" style="display:none;">ℹ تفاصيل العمل</button>
      </div>
    </div>
  </header>

  <!-- قسم التصنيفات والفلترة المتقدمة -->
  <section class="genres-section" id="genresSection" style="display: none;">
    <div class="section-title" style="margin-bottom:15px;">اختر التصنيف السينمائي</div>
    <div class="genres-grid" id="genresGrid"></div>

    <div class="filter-bar">
      <div class="filter-group">
        <label>ترتيب حسب:</label>
        <select class="filter-select" id="sortBySelect" onchange="applyFilters()">
          <option value="popularity.desc">الأكثر شعبية عالمياً</option>
          <option value="vote_average.desc">الأعلى تقييماً</option>
          <option value="primary_release_date.desc">أحدث الإصدارات</option>
          <option value="title.asc">الأبجدي (A-Z)</option>
        </select>
      </div>

      <div class="filter-group">
        <label>اللغة الأصلية:</label>
        <select class="filter-select" id="langSelect" onchange="applyFilters()">
          <option value="">جميع اللغات</option>
          <option value="en">الإنجليزية (English)</option>
          <option value="ar">العربية (Arabic)</option>
          <option value="fr">الفرنسية (French)</option>
          <option value="ja">اليابانية (Japanese)</option>
        </select>
      </div>
    </div>
  </section>

  <!-- شبكة عرض الأفلام والمسلسلات -->
  <main class="main-section">
    <div class="section-header">
      <div class="section-title" id="sectionTitle">أحدث الأفلام الشائعة</div>
    </div>
    <div class="grid-container" id="contentGrid"></div>
    <div class="loader" id="loader">⏳ جاري تحميل المزيد من المحتوى الساحر...</div>
  </main>

  <!-- نافذة تفاصيل العمل السينمائي -->
  <div class="modal" id="detailsModal" onclick="if(event.target === this) closeModal('detailsModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal" onclick="closeModal('detailsModal')">&times;</button>

      <div class="details-hero" id="modalBackdrop">
        <div class="details-hero-overlay"></div>
      </div>

      <div class="details-body">
        <div class="details-header">
          <img src="" id="modalPoster" class="details-poster" alt="">
          <div style="display:flex; flex-direction:column; justify-content:flex-end; gap: 8px;">
            <h2 style="font-size: 26px; font-weight: 800;" id="modalTitle"></h2>
            <div style="color: #f5c518; font-size: 14px; font-weight: 600;" id="modalMeta"></div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px;">
              <button class="btn-main" id="modalPlayBtn">▶ مشاهدة الآن</button>
              <button class="btn-secondary" id="modalWatchlistBtn">+ إضافة للمفضلة</button>
            </div>
          </div>
        </div>
        <p style="color: #d1d1d6; line-height: 1.7; font-size: 14px; margin-top: 15px;" id="modalOverview"></p>
      </div>
    </div>
  </div>

  <!-- نافذة المشغل السينمائي المحترف مع مبدل السيرفرات -->
  <div class="modal" id="videoModal" onclick="if(event.target === this) closePlayer()">
    <div class="player-modal-content">
      <button class="close-modal" onclick="closePlayer()">&times;</button>
      <div class="player-wrapper" id="playerWrapper"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
